[package]
name = "videoenhancer-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
build = "build.rs"
license = "MIT"

[[bin]]
name = "VideoEnhancer"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
cdp = []
e2e = ["cdp"]

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[target.'cfg(windows)'.dependencies]
videoenhancer-player = { path = "player" }
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
rfd = { version = "=0.17.2", features = ["common-controls-v6"] }
arboard = { version = "=3.7.0", default-features = false }
winreg = "=0.56.0"
sha2 = "=0.10.9"
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
