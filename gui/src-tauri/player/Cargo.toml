[package]
name = "videoenhancer-player"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
test-faults = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.22.1"
png = "=0.18.1"

[target.'cfg(windows)'.dependencies]
libloading = "=0.8.9"
tao = "=0.37.1"
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectComposition", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "VideoEnhancer-Player"
path = "src/main.rs"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
