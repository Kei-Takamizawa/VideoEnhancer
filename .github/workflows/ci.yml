name: CPU engine checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  VE_DEV_M3_MEDIA: "0"

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not gpu and not soak" --basetemp=.venv/testtmp
        env:
          VE_HOME: ${{ runner.temp }}/ve-home
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
        working-directory: gui
      - run: npm run lint
        working-directory: gui
      - run: npm run typecheck
        working-directory: gui
      - run: npm test
        working-directory: gui
      - run: npm run build
        working-directory: gui
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - name: Non-Windows refusal stub
        if: runner.os == 'Linux'
        shell: bash
        run: |
          result=$(cargo run --quiet --manifest-path gui/src-tauri/Cargo.toml)
          test "$result" = "The desktop app requires Windows 11."
      - name: Rust format, lint and tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo fmt --manifest-path gui/src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path gui/src-tauri/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path gui/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Tauri test shell
        if: runner.os == 'Windows'
        run: cargo build --manifest-path gui/src-tauri/Cargo.toml --features e2e
      - name: Tauri CPU end-to-end over CDP
        if: runner.os == 'Windows'
        run: npm run test:e2e
        working-directory: gui
        env:
          VE_GUI_EVIDENCE: ${{ runner.temp }}/ve-gui-evidence
          VE_GUI_TEST_ROOT: ${{ runner.temp }}/scratch/ve-e2e
          VE_TAURI_EXE: ${{ github.workspace }}/gui/src-tauri/target/debug/VideoEnhancer.exe
